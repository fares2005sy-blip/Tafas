<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>طفس الرسمية | Tafas</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Tahoma,Arial,sans-serif;
background:#f3f3f3;
color:#222;
}


header{
background:#111;
color:white;
padding:20px;
text-align:center;
position:relative;
}


.logo-img{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
border:3px solid white;
}


.logo{
font-size:38px;
font-weight:bold;
}


.subtitle{
color:#ddd;
font-size:18px;
}


.menu-btn{
position:absolute;
right:20px;
top:25px;
font-size:32px;
cursor:pointer;
}


.menu{

display:none;
position:absolute;
right:10px;
top:70px;
background:white;
width:200px;
border-radius:10px;
overflow:hidden;
z-index:10;

}


.menu a{

display:block;
padding:12px;
color:#222;
text-decoration:none;
border-bottom:1px solid #ddd;

}



.breaking{

background:#d00000;
color:white;
margin:20px;
padding:12px;
border-radius:8px;
font-weight:bold;

}



.container{

padding:20px;

}



.post{

background:white;
border-radius:12px;
padding:15px;
margin-bottom:20px;
box-shadow:0 2px 8px #ddd;

}



.post img{

width:100%;
height:220px;
object-fit:cover;
border-radius:10px;

}



.post h3{

color:#b40000;

}



.date{

color:#777;
font-size:14px;

}



video{

width:100%;
border-radius:10px;

}



footer{

background:#111;
color:white;
text-align:center;
padding:20px;
margin-top:30px;

}


</style>

</head>


<body>


<header>


<div class="menu-btn" onclick="openMenu()">
☰
</div>


<img src="logo.png.PNG" class="logo-img">


<div class="logo">
طفس الرسمية
</div>


<div class="subtitle">
Tafas Official
</div>



<div class="menu" id="menu">

<a href="#">الرئيسية</a>
<a href="#">طفس</a>
<a href="#">درعا</a>
<a href="#">سوريا</a>
<a href="#">وفيات</a>

</div>


</header>



<div class="breaking">

🚨 عاجل | آخر الأخبار والتحديثات من طفس

</div>



<div class="container">


<div class="posts" id="posts">


<h2>
آخر المنشورات
</h2>


</div>


</div>



<footer>

© 2026 طفس الرسمية

<br>

تصميم وتطوير: فارس الرفاعي

</footer>




<script>


function openMenu(){

let menu=document.getElementById("menu");


if(menu.style.display==="block"){

menu.style.display="none";

}else{

menu.style.display="block";

}

}


</script>




<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


const supabaseUrl =
"https://bcrrogdjklozokgdvgea.supabase.co";


const supabaseKey =
"sb_publishable_ChYRSvUvuEoTccNA6jDEVw_ipjty2kB";



const supabase =
window.supabase.createClient(
supabaseUrl,
supabaseKey
);




async function loadPosts(){


const {data,error}=await supabase
.from("posts")
.select("*")
.order("created_at",{ascending:false});



if(error){

console.log(error);

document.getElementById("posts").innerHTML =
"<h3>حدث خطأ في تحميل الأخبار</h3>";

return;

}



let box=document.getElementById("posts");


box.innerHTML="<h2>آخر المنشورات</h2>";



data.forEach(post=>{


box.innerHTML += `


<div class="post">


${post.image ? 
`<img src="${post.image}">`
:
""}



<h3>

${post.title || ""}

</h3>



<div class="date">

${post.created_at ?
new Date(post.created_at)
.toLocaleDateString("ar")
:
""
}

</div>



<p>

${post.content || ""}

</p>



${post.video ?

`
<video controls>

<source src="${post.video}">

</video>
`

:

""

}



</div>


`;

});


}



loadPosts();



</script>



</body>

</html>
