<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة تحكم طفس الرسمية</title>

<style>

body{
font-family:Tahoma,Arial,sans-serif;
background:#f3f3f3;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
margin:0;
flex-direction:column;
}


.login{

background:white;
width:320px;
padding:25px;
border-radius:15px;
box-shadow:0 3px 10px #ccc;
text-align:center;

}


.logo{

width:90px;
height:90px;
border-radius:50%;
object-fit:cover;
border:3px solid #b40000;

}


h2{

color:#b40000;

}


input{

width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ddd;
border-radius:8px;
font-size:15px;

}


button{

background:#b40000;
color:white;
border:0;
padding:12px;
width:100%;
border-radius:8px;
font-size:16px;
cursor:pointer;

}


button:hover{

background:#900000;

}


footer{

margin-top:20px;
text-align:center;
color:#777;
font-size:14px;

}


</style>

</head>


<body>



<div class="login">


<img src="logo.png.PNG" class="logo">


<h2>
طفس الرسمية
</h2>


<p>
دخول لوحة التحكم
</p>



<input id="user" placeholder="اسم المستخدم">



<input id="pass" type="password" placeholder="كلمة المرور">



<button onclick="login()">

دخول

</button>



</div>




<footer>

© 2026 طفس الرسمية

<br>

تصميم وتطوير: فارس الرفاعي 

</footer>




<script>


function login(){


let user=document.getElementById("user").value;

let pass=document.getElementById("pass").value;



if(user=="tafas" && pass=="123456"){


alert("تم تسجيل الدخول بنجاح");


window.location.href="dashboard.html";


}

else{


alert("اسم المستخدم أو كلمة المرور غير صحيحة");


}


}



</script>



</body>

</html>
