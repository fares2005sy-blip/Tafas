<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>دخول لوحة تحكم طفس الرسمية</title>

<style>

body{
font-family:Tahoma,Arial,sans-serif;
background:#f3f3f3;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
margin:0;
}


.login{

background:white;
width:320px;
padding:25px;
border-radius:15px;
box-shadow:0 3px 10px #ccc;
text-align:center;

}


.logo{

width:90px;
height:90px;
border-radius:50%;
object-fit:cover;

}


h2{

color:#b40000;

}


input{

width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ddd;
border-radius:8px;
font-size:16px;

}


button{

width:100%;
padding:12px;
background:#b40000;
color:white;
border:none;
border-radius:8px;
font-size:17px;
cursor:pointer;

}


button:hover{

background:#900000;

}


</style>

</head>


<body>


<div class="login">


<img src="logo.png.PNG" class="logo">


<h2>
طفس الرسمية
</h2>


<p>
دخول لوحة التحكم
</p>


<input 
id="user"
type="text"
placeholder="اسم المستخدم">


<input
id="pass"
type="password"
placeholder="كلمة المرور">


<button onclick="login()">
دخول
</button>


</div>



<script>

function login(){


let user =
document.getElementById("user").value;


let pass =
document.getElementById("pass").value;



if(user === "tafas" && pass === "123456"){


localStorage.setItem(
"tafasLogin",
"true"
);


alert("تم تسجيل الدخول بنجاح");


window.location.href =
"dashboard.html";


}else{


alert("اسم المستخدم أو كلمة المرور غير صحيحة");


}


}


</script>


</body>

</html>
