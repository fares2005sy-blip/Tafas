<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
لوحة تحكم طفس الرسمية
</title>



<style>


*{
box-sizing:border-box;
}



body{

margin:0;

font-family:Tahoma,Arial,sans-serif;

background:#f2f2f2;

color:#222;

}





header{

background:#111;

color:white;

padding:20px;

text-align:center;

}



.logo{

width:100px;

height:100px;

border-radius:50%;

object-fit:cover;

border:3px solid white;

}




header h1{

margin:10px 0;

font-size:30px;

}





.container{

max-width:800px;

margin:30px auto;

padding:20px;

}





.box{

background:white;

padding:25px;

border-radius:15px;

box-shadow:0 3px 10px #ccc;

margin-bottom:25px;

}





h2{

color:#b40000;

border-right:5px solid #b40000;

padding-right:10px;

}





input,
textarea,
select{


width:100%;

padding:12px;

margin:10px 0;

border:1px solid #ddd;

border-radius:8px;

font-size:16px;


}





textarea{

height:140px;

resize:none;

}





button{


padding:12px;

border:0;

border-radius:8px;

font-size:16px;

cursor:pointer;

color:white;

background:#b40000;

width:100%;


}





button:hover{

background:#900000;

}




.delete{

background:#222;

}





.edit{

background:#0066aa;

}




.post{


background:#fff;

border-radius:12px;

padding:15px;

margin-top:15px;

box-shadow:0 2px 8px #ddd;


}




.post img,
.post video{


width:100%;

border-radius:10px;

margin-top:10px;


}





.post h3{

color:#b40000;

}





.actions{


display:flex;

gap:10px;

margin-top:10px;


}





.actions button{


width:50%;


}





footer{


text-align:center;

padding:20px;

color:#777;


}



</style>


</head>


<body>



<header>


<img src="logo.png.PNG" class="logo">


<h1>
لوحة تحكم طفس الرسمية
</h1>


</header>





<div class="container">
  <div class="box">

<h2>
إضافة منشور جديد
</h2>


<input 
id="title"
placeholder="عنوان الخبر">


<textarea 
id="content"
placeholder="نص الخبر">
</textarea>



<label>
القسم
</label>


<select id="category">

<option value="طفس">
طفس
</option>

<option value="درعا">
درعا
</option>

<option value="سوريا">
سوريا
</option>

<option value="وفيات">
وفيات
</option>

</select>




<label>
صورة الخبر
</label>


<input 
type="file"
id="image"
accept="image/*">





<label>
فيديو الخبر (اختياري)
</label>


<input 
type="file"
id="video"
accept="video/*">





<img 
id="imagePreview"
style="
display:none;
width:100%;
border-radius:10px;
margin-top:10px;
">





<video 
id="videoPreview"
controls
style="
display:none;
width:100%;
border-radius:10px;
margin-top:10px;
">
</video>





<button onclick="publish()">

نشر الخبر

</button>


</div>








<div class="box">


<h2>
إدارة المنشورات
</h2>



<div id="posts">

جاري تحميل المنشورات...

</div>



</div>





<button onclick="logout()" style="background:#333">

تسجيل الخروج

</button>






<footer>

© 2026 طفس الرسمية

<br>

تصميم وتطوير: فارس الرفاعي

</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


// حماية لوحة التحكم

if(localStorage.getItem("tafasLogin") !== "true"){

window.location.href="admin.html";

}






// إعداد Supabase


const supabaseUrl =
"https://bcrrogdjklozokgdvgea.supabase.co";


const supabaseKey =
"sb_publishable_ChYRSvUvuEoTccNA6jDEVw_ipjty2kB";



const supabase =
window.supabase.createClient(
supabaseUrl,
supabaseKey
);






let editId = null;






// معاينة الصورة


document.getElementById("image").onchange=function(e){


let img=document.getElementById("imagePreview");


img.src=URL.createObjectURL(e.target.files[0]);


img.style.display="block";


};







// معاينة الفيديو


document.getElementById("video").onchange=function(e){


let video=document.getElementById("videoPreview");


video.src=URL.createObjectURL(e.target.files[0]);


video.style.display="block";


};








// نشر أو تعديل


async function publish(){



let title =
document.getElementById("title").value;


let content =
document.getElementById("content").value;


let category =
document.getElementById("category").value;



let imageFile =
document.getElementById("image").files[0];


let videoFile =
document.getElementById("video").files[0];





if(title==="" || content===""){


alert("اكتب العنوان والنص");


return;


}






let imageUrl="";

let videoUrl="";






// رفع الصورة


if(imageFile){


let name =
Date.now()+"_"+imageFile.name;



let {error}=await supabase

.storage

.from("uploads")

.upload(name,imageFile);



if(error){

alert("خطأ في رفع الصورة");

return;

}



let url =
supabase

.storage

.from("uploads")

.getPublicUrl(name);



imageUrl=url.data.publicUrl;


}







// رفع الفيديو


if(videoFile){


let name =
Date.now()+"_"+videoFile.name;



let {error}=await supabase

.storage

.from("uploads")

.upload(name,videoFile);



if(error){

alert("خطأ في رفع الفيديو");

return;

}



let url =
supabase

.storage

.from("uploads")

.getPublicUrl(name);



videoUrl=url.data.publicUrl;


}








let data={

title:title,

content:content,

category:category

};




if(imageUrl){

data.image=imageUrl;

}



if(videoUrl){

data.video=videoUrl;

}







// تعديل


if(editId){



await supabase

.from("posts")

.update(data)

.eq("id",editId);



alert("تم تعديل الخبر");



editId=null;



}





// نشر جديد


else{



await supabase

.from("posts")

.insert([data]);



alert("تم نشر الخبر");



}






clearForm();


loadPosts();



}








// تحميل المنشورات


async function loadPosts(){



let {data,error}=await supabase

.from("posts")

.select("*")

.order("created_at",{ascending:false});




if(error){

console.log(error);

return;

}






let box=document.getElementById("posts");


box.innerHTML="";






data.forEach(post=>{



box.innerHTML += `


<div class="post">


${post.image ?

`<img src="${post.image}">`

:

""

}



<h3>

${post.title}

</h3>



<p>

${post.content}

</p>



<p>

القسم: ${post.category}

</p>




${post.video ?

`
<video controls>
<source src="${post.video}">
</video>
`

:

""

}






<div class="actions">


<button class="edit"

onclick="editPost('${post.id}')">

تعديل

</button>



<button class="delete"

onclick="deletePost('${post.id}')">

حذف

</button>



</div>



</div>


`;



});



}










// حذف منشور


async function deletePost(id){



if(!confirm("هل تريد حذف هذا الخبر؟"))

return;



await supabase

.from("posts")

.delete()

.eq("id",id);



alert("تم الحذف");



loadPosts();



}








// تعديل منشور


async function editPost(id){



let {data}=await supabase

.from("posts")

.select("*")

.eq("id",id)

.single();




document.getElementById("title").value=data.title;


document.getElementById("content").value=data.content;


document.getElementById("category").value=data.category;



editId=id;



window.scrollTo({

top:0,

behavior:"smooth"

});



}









function clearForm(){


document.getElementById("title").value="";


document.getElementById("content").value="";


document.getElementById("image").value="";


document.getElementById("video").value="";


document.getElementById("imagePreview").style.display="none";


document.getElementById("videoPreview").style.display="none";


}








function logout(){


localStorage.removeItem("tafasLogin");


window.location.href="admin.html";


}







loadPosts();



</script>
