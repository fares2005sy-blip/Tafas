
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة تحكم طفس الرسمية</title>

<style>

body{
font-family:Tahoma,Arial,sans-serif;
background:#f3f3f3;
margin:0;
padding:20px;
}


.box{
background:white;
max-width:600px;
margin:auto;
padding:25px;
border-radius:15px;
box-shadow:0 3px 10px #ccc;
}


.logo{
display:block;
margin:auto;
width:90px;
height:90px;
border-radius:50%;
object-fit:cover;
}


h1{
text-align:center;
color:#b40000;
}


input,textarea,select{

width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ddd;
border-radius:8px;
font-size:16px;

}


textarea{
height:130px;
}


button{

width:100%;
background:#b40000;
color:white;
border:0;
padding:14px;
border-radius:8px;
font-size:17px;
cursor:pointer;

}


button:hover{

background:#900000;

}


.preview img,
.preview video{

width:100%;
margin-top:10px;
border-radius:10px;

}


footer{

text-align:center;
color:#777;
margin-top:25px;
font-size:14px;

}

</style>

</head>


<body>


<div class="box">


<img src="logo.png.PNG" class="logo">


<h1>
لوحة تحكم طفس الرسمية
</h1>


<h3>
إضافة منشور جديد
</h3>


<input type="text" placeholder="عنوان الخبر">


<textarea placeholder="نص الخبر"></textarea>



<label>
صورة الخبر
</label>

<input type="file" accept="image/*" id="image">



<label>
فيديو الخبر (اختياري)
</label>

<input type="file" accept="video/*" id="video">



<select>

<option>
طفس
</option>

<option>
درعا
</option>

<option>
سوريا
</option>

<option>
وفيات
</option>

</select>



<div class="preview">

<img id="imagePreview" style="display:none">

<video id="videoPreview" controls style="display:none"></video>

</div>



<button onclick="publish()">

نشر الخبر

</button>



</div>



<footer>

© 2026 طفس الرسمية

<br>

تصميم وتطوير: فارس الرفاعي

</footer>




<script>


// معاينة الصورة

document.getElementById("image").onchange=function(e){

let img=document.getElementById("imagePreview");

img.src=URL.createObjectURL(e.target.files[0]);

img.style.display="block";

}




// معاينة الفيديو

document.getElementById("video").onchange=function(e){

let video=document.getElementById("videoPreview");

video.src=URL.createObjectURL(e.target.files[0]);

video.style.display="block";

}




function publish(){

alert("تم تجهيز الخبر للنشر، سنربطه بقاعدة البيانات في الخطوة القادمة");

}


</script>



</body>

</html>
