<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة تحكم طفس الرسمية</title>

<style>

body{
font-family:Tahoma,Arial,sans-serif;
background:#f3f3f3;
margin:0;
padding:20px;
}

.box{
background:white;
max-width:600px;
margin:auto;
padding:25px;
border-radius:15px;
box-shadow:0 3px 10px #ccc;
}

.logo{
display:block;
margin:auto;
width:90px;
height:90px;
border-radius:50%;
object-fit:cover;
}

h1{
text-align:center;
color:#b40000;
}

input,textarea,select{

width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ddd;
border-radius:8px;
font-size:16px;

}

textarea{
height:130px;
}

button{

width:100%;
background:#b40000;
color:white;
border:0;
padding:14px;
border-radius:8px;
font-size:17px;
cursor:pointer;

}

button:hover{
background:#900000;
}

.preview img,
.preview video{

width:100%;
margin-top:10px;
border-radius:10px;

}

footer{

text-align:center;
color:#777;
margin-top:25px;
font-size:14px;

}

</style>

</head>


<body>


<script>

if(localStorage.getItem("tafasLogin") !== "true"){

window.location.href="admin.html";

}

</script>


<div class="box">


<button onclick="logout()" style="background:#333">
تسجيل الخروج
</button>


<img src="logo.png.PNG" class="logo">


<h1>
لوحة تحكم طفس الرسمية
</h1>


<h3>
إضافة منشور جديد
</h3>


<input id="title" type="text" placeholder="عنوان الخبر">


<textarea id="content" placeholder="نص الخبر"></textarea>


<label>
صورة الخبر
</label>

<input type="file" id="image" accept="image/*">


<label>
فيديو الخبر (اختياري)
</label>

<input type="file" id="video" accept="video/*">


<select id="category">

<option>طفس</option>
<option>درعا</option>
<option>سوريا</option>
<option>وفيات</option>

</select>


<div class="preview">

<img id="imagePreview" style="display:none">

<video id="videoPreview" controls style="display:none"></video>

</div>


<button onclick="publish()">
نشر الخبر
</button>


</div>


<footer>

© 2026 طفس الرسمية

<br>

تصميم وتطوير: فارس الرفاعي

</footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


const supabaseUrl =
"https://bcrrogdjklozokgdvgea.supabase.co";


const supabaseKey =
"sb_publishable_ChYRSvUvuEoTccNA6jDEVw_ipjty2kB";


const supabase =
window.supabase.createClient(
supabaseUrl,
supabaseKey
);



// معاينة الصورة

document.getElementById("image").onchange=function(e){

let img=document.getElementById("imagePreview");

img.src=URL.createObjectURL(e.target.files[0]);

img.style.display="block";

}



// معاينة الفيديو

document.getElementById("video").onchange=function(e){

let video=document.getElementById("videoPreview");

video.src=URL.createObjectURL(e.target.files[0]);

video.style.display="block";

}



// نشر الخبر

async function publish(){


let title =
document.getElementById("title").value;


let content =
document.getElementById("content").value;


let category =
document.getElementById("category").value;


let imageFile =
document.getElementById("image").files[0];


let videoFile =
document.getElementById("video").files[0];



let imageUrl="";

let videoUrl="";



// رفع الصورة

if(imageFile){


let imageName =
Date.now()+"_"+imageFile.name;


let {error}=await supabase
.storage
.from("uploads")
.upload(imageName,imageFile);



if(error){

alert("خطأ في رفع الصورة");

console.log(error);

return;

}



let result =
supabase
.storage
.from("uploads")
.getPublicUrl(imageName);


imageUrl =
result.data.publicUrl;


}



// رفع الفيديو

if(videoFile){


let videoName =
Date.now()+"_"+videoFile.name;



let {error}=await supabase
.storage
.from("uploads")
.upload(videoName,videoFile);



if(error){

alert("خطأ في رفع الفيديو");

console.log(error);

return;

}



let result =
supabase
.storage
.from("uploads")
.getPublicUrl(videoName);


videoUrl =
result.data.publicUrl;


}




// حفظ المنشور في posts

let {error}=await supabase
.from("posts")
.insert([{

title:title,

content:content,

image:imageUrl,

video:videoUrl,

category:category

}]);



if(error){

console.log(error);

alert("حدث خطأ أثناء نشر الخبر");

}

else{

alert("تم نشر الخبر بنجاح ✅");


}



}



// تسجيل الخروج

function login(){

let user = document.getElementById("user").value;

let pass = document.getElementById("pass").value;


if(user=="tafas" && pass=="123456"){


alert("تم تسجيل الدخول بنجاح");


localStorage.setItem("tafasLogin","true");


window.location.href="dashboard.html";


}else{


alert("اسم المستخدم أو كلمة المرور غير صحيحة");


}

}
