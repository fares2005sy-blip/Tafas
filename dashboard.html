<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
لوحة تحكم طفس الرسمية
</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

font-family:Tahoma,Arial,sans-serif;

background:#f2f2f2;

}



header{

background:#111;

color:white;

padding:20px;

text-align:center;

}



.logo{

width:100px;

height:100px;

border-radius:50%;

object-fit:cover;

border:3px solid white;

}



h1{

color:white;

}



.container{

max-width:700px;

margin:30px auto;

background:white;

padding:25px;

border-radius:15px;

box-shadow:0 3px 10px #ccc;

}



h2{

color:#b40000;

border-right:5px solid #b40000;

padding-right:10px;

}



input,
textarea,
select{


width:100%;

padding:12px;

margin:10px 0;

border:1px solid #ddd;

border-radius:8px;

font-size:16px;

}



textarea{

height:150px;

}



label{

font-weight:bold;

}



button{

width:100%;

padding:14px;

background:#b40000;

color:white;

border:0;

border-radius:8px;

font-size:17px;

cursor:pointer;

margin-top:10px;

}



button:hover{

background:#900000;

}



.logout{

background:#222;

}



.preview img,
.preview video{

width:100%;

margin-top:15px;

border-radius:10px;

}



footer{

text-align:center;

padding:20px;

color:#777;

}


</style>

</head>


<body>


<header>


<img src="logo.png.PNG" class="logo">


<h1>
لوحة تحكم طفس الرسمية
</h1>


</header>
