<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
لوحة تحكم طفس الرسمية
</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

font-family:Tahoma,Arial,sans-serif;

background:#f2f2f2;

}



header{

background:#111;

color:white;

padding:20px;

text-align:center;

}



.logo{

width:100px;

height:100px;

border-radius:50%;

object-fit:cover;

border:3px solid white;

}



h1{

color:white;

}



.container{

max-width:700px;

margin:30px auto;

background:white;

padding:25px;

border-radius:15px;

box-shadow:0 3px 10px #ccc;

}



h2{

color:#b40000;

border-right:5px solid #b40000;

padding-right:10px;

}



input,
textarea,
select{


width:100%;

padding:12px;

margin:10px 0;

border:1px solid #ddd;

border-radius:8px;

font-size:16px;

}



textarea{

height:150px;

}



label{

font-weight:bold;

}



button{

width:100%;

padding:14px;

background:#b40000;

color:white;

border:0;

border-radius:8px;

font-size:17px;

cursor:pointer;

margin-top:10px;

}



button:hover{

background:#900000;

}



.logout{

background:#222;

}



.preview img,
.preview video{

width:100%;

margin-top:15px;

border-radius:10px;

}



footer{

text-align:center;

padding:20px;

color:#777;

}


</style>

</head>


<body>


<header>


<img src="logo.png.PNG" class="logo">


<h1>
لوحة تحكم طفس الرسمية
</h1>


</header>
<div class="container">


<h2>
إضافة خبر جديد
</h2>



<input 
id="title"
type="text"
placeholder="عنوان الخبر">



<textarea 
id="content"
placeholder="نص الخبر">
</textarea>




<label>
القسم
</label>


<select id="category">


<option value="طفس">
طفس
</option>


<option value="درعا">
درعا
</option>


<option value="سوريا">
سوريا
</option>


<option value="وفيات">
وفيات
</option>


</select>




<label>
صورة الخبر
</label>


<input 
type="file"
id="image"
accept="image/*">





<label>
فيديو الخبر (اختياري)
</label>


<input 
type="file"
id="video"
accept="video/*">





<div class="preview">


<img 
id="imagePreview"
style="display:none;">



<video 
id="videoPreview"
controls
style="display:none;">
</video>


</div>





<button onclick="publish()">

نشر الخبر

</button>





<button class="logout" onclick="logout()">

تسجيل الخروج

</button>



</div>




<footer>

© 2026 طفس الرسمية

<br>

تصميم وتطوير: فارس الرفاعي

</footer>





<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>




<script>


// حماية الصفحة


if(localStorage.getItem("tafasLogin") !== "true"){

window.location.href="admin.html";

}





// Supabase


const supabaseUrl =
"https://bcrrogdjklozokgdvgea.supabase.co";


const supabaseKey =
"sb_publishable_ChYRSvUvuEoTccNA6jDEVw_ipjty2kB";



const supabase =
window.supabase.createClient(
supabaseUrl,
supabaseKey
);







// معاينة الصورة


document.getElementById("image").onchange=function(e){


let img=document.getElementById("imagePreview");


img.src=URL.createObjectURL(e.target.files[0]);


img.style.display="block";


};







// معاينة الفيديو


document.getElementById("video").onchange=function(e){


let video=document.getElementById("videoPreview");


video.src=URL.createObjectURL(e.target.files[0]);


video.style.display="block";


};







// نشر الخبر


async function publish(){



let title =
document.getElementById("title").value;



let content =
document.getElementById("content").value;



let category =
document.getElementById("category").value;



let imageFile =
document.getElementById("image").files[0];



let videoFile =
document.getElementById("video").files[0];





if(title=="" || content==""){


alert("اكتب عنوان الخبر والنص");


return;


}




let imageUrl="";

let videoUrl="";







// رفع الصورة


if(imageFile){


let imageName =
Date.now()+"_"+imageFile.name;



let {error}=await supabase

.storage

.from("uploads")

.upload(imageName,imageFile);



if(error){


alert("خطأ في رفع الصورة");


console.log(error);


return;


}




let result =
supabase

.storage

.from("uploads")

.getPublicUrl(imageName);



imageUrl=result.data.publicUrl;



}









// رفع الفيديو


if(videoFile){


let videoName =
Date.now()+"_"+videoFile.name;



let {error}=await supabase

.storage

.from("uploads")

.upload(videoName,videoFile);



if(error){


alert("خطأ في رفع الفيديو");


console.log(error);


return;


}




let result =
supabase

.storage

.from("uploads")

.getPublicUrl(videoName);



videoUrl=result.data.publicUrl;



}









// حفظ الخبر


let {error}=await supabase

.from("posts")

.insert([{


title:title,


content:content,


image:imageUrl,


video:videoUrl,


category:category



}]);






if(error){


console.log(error);


alert("حدث خطأ أثناء النشر");


return;


}



alert("تم نشر الخبر بنجاح ✅");



// تنظيف النموذج


document.getElementById("title").value="";

document.getElementById("content").value="";

document.getElementById("image").value="";

document.getElementById("video").value="";



}








// تسجيل الخروج


function logout(){


localStorage.removeItem("tafasLogin");


window.location.href="admin.html";


}



</script>


</body>

</html>
